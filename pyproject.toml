[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task_manager"
version = "0.9.0"
description = "Лабораторна робота №9. Варіант 14: Система керування завданнями (Паралельність, багатопроцесність та оптимізація)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
